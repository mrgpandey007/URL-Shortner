<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>URL Shortener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem;
      width: 100%;
      max-width: 560px;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header .icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a2e;
    }

    .header p {
      font-size: 0.9rem;
      color: #888;
      margin-top: 0.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #1a1a2e;
      background: #fafafa;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus { border-color: #4f46e5; background: #fff; }

    .form-group { margin-bottom: 1rem; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: #4338ca; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-top: 1rem;
      display: none;
    }

    .result {
      margin-top: 1.5rem;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 1.25rem;
      display: none;
    }

    .result-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #16a34a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .short-url-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .short-url {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a1a2e;
      word-break: break-all;
      flex: 1;
    }

    .copy-btn {
      padding: 0.4rem 0.9rem;
      border: 1.5px solid #16a34a;
      background: transparent;
      color: #16a34a;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .copy-btn:hover { background: #16a34a; color: white; }
    .copy-btn.copied { background: #16a34a; color: white; }

    .orig { font-size: 0.8rem; color: #888; margin-top: 0.5rem; word-break: break-all; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #bbf7d0;
      text-align: center;
    }

    .stat-num { font-size: 1.2rem; font-weight: 700; color: #1a1a2e; }
    .stat-lbl { font-size: 0.7rem; color: #888; text-transform: uppercase; }

    .divider {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin: 2rem 0;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 0.75rem;
    }

    .lookup-row { display: flex; gap: 0.75rem; }
    .lookup-row input { margin: 0; }

    .lookup-btn {
      padding: 0.75rem 1.25rem;
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .lookup-btn:hover { opacity: 0.85; }

    .stats-box {
      margin-top: 1rem;
      background: #f8faff;
      border: 1px solid #e0e7ff;
      border-radius: 12px;
      padding: 1.25rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="header">
      <div class="icon">🔗</div>
      <h1>URL Shortener</h1>
      <p>Paste a long URL and get a short link instantly</p>
    </div>

    <div class="form-group">
      <label>Long URL</label>
      <input id="urlInput" type="url" placeholder="https://example.com/your-long-url-here"/>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Custom Alias (optional)</label>
        <input id="aliasInput" type="text" placeholder="my-brand"/>
      </div>
      <div class="form-group">
        <label>Expires in hours (optional)</label>
        <input id="expiryInput" type="number" placeholder="24" min="1"/>
      </div>
    </div>

    <button class="btn" id="shortenBtn" onclick="shortenUrl()">Shorten URL</button>

    <div class="error" id="errorBox"></div>

    <div class="result" id="resultBox">
      <div class="result-label">✓ Your short link is ready</div>
      <div class="short-url-row">
        <div class="short-url" id="resultUrl"></div>
        <button class="copy-btn" id="copyBtn" onclick="copyUrl()">Copy</button>
      </div>
      <div class="orig" id="origUrl"></div>
      <div class="stats-row">
        <div><div class="stat-num" id="sClicks">0</div><div class="stat-lbl">Clicks</div></div>
        <div><div class="stat-num" id="sCreated">—</div><div class="stat-lbl">Created</div></div>
        <div><div class="stat-num" id="sExpires">∞</div><div class="stat-lbl">Expires</div></div>
      </div>
    </div>

    <hr class="divider"/>

    <div class="section-title">Look up stats by short code</div>
    <div class="lookup-row">
      <input id="lookupInput" type="text" placeholder="Enter short code, e.g. aX9kLm"/>
      <button class="lookup-btn" onclick="lookupStats()">Stats</button>
    </div>

    <div class="stats-box" id="statsBox"></div>

  </div>

  <script>
    const BASE = 'http://localhost:8080';

    function fmt(d) {
      if (!d) return '∞';
      return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
      document.getElementById('resultBox').style.display = 'none';
      setTimeout(() => box.style.display = 'none', 5000);
    }

    async function shortenUrl() {
      const url    = document.getElementById('urlInput').value.trim();
      const alias  = document.getElementById('aliasInput').value.trim();
      const expiry = document.getElementById('expiryInput').value.trim();

      if (!url) { showError('Please enter a URL.'); return; }
      if (!url.startsWith('http')) { showError('URL must start with http:// or https://'); return; }

      const btn = document.getElementById('shortenBtn');
      btn.disabled = true;
      btn.textContent = 'Shortening...';

      const body = { url };
      if (alias)  body.customAlias = alias;
      if (expiry) body.expiryHours = parseInt(expiry);

      try {
        const res  = await fetch(`${BASE}/api/shorten`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (!res.ok) { showError(data.message || 'Something went wrong.'); return; }

        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('errorBox').style.display = 'none';
        document.getElementById('resultUrl').textContent  = data.shortUrl;
        document.getElementById('origUrl').textContent    = data.originalUrl;
        document.getElementById('sClicks').textContent    = data.clickCount ?? 0;
        document.getElementById('sCreated').textContent   = fmt(data.createdAt);
        document.getElementById('sExpires').textContent   = fmt(data.expiresAt);
      } catch (e) {
        showError('Cannot connect. Is the Spring Boot server running on port 8080?');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten URL';
      }
    }

    async function copyUrl() {
      const url = document.getElementById('resultUrl').textContent;
      try {
        await navigator.clipboard.writeText(url);
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      } catch (e) {
        alert('Copy failed — please copy manually.');
      }
    }

    async function lookupStats() {
      const code = document.getElementById('lookupInput').value.trim();
      if (!code) return;

      const box = document.getElementById('statsBox');
      box.style.display = 'block';
      box.innerHTML = '<span style="color:#888;font-size:0.875rem">Fetching...</span>';

      try {
        const res  = await fetch(`${BASE}/api/stats/${code}`);
        const data = await res.json();

        if (!res.ok) {
          box.innerHTML = `<span style="color:#dc2626;font-size:0.875rem">${data.message || 'Not found.'}</span>`;
          return;
        }

        box.innerHTML = `
          <div style="font-weight:700;font-size:1rem;color:#1a1a2e;margin-bottom:0.25rem">${data.shortUrl}</div>
          <div style="font-size:0.8rem;color:#888;margin-bottom:1rem;word-break:break-all">${data.originalUrl}</div>
          <div class="stats-row" style="border-top:1px solid #e0e7ff;padding-top:1rem;margin-top:0">
            <div><div class="stat-num">${data.clickCount ?? 0}</div><div class="stat-lbl">Clicks</div></div>
            <div><div class="stat-num">${fmt(data.createdAt)}</div><div class="stat-lbl">Created</div></div>
            <div><div class="stat-num">${fmt(data.expiresAt)}</div><div class="stat-lbl">Expires</div></div>
          </div>`;
      } catch (e) {
        box.innerHTML = '<span style="color:#dc2626;font-size:0.875rem">Cannot connect to server.</span>';
      }
    }

    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') shortenUrl();
    });
    document.getElementById('lookupInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') lookupStats();
    });
  </script>
</body>
</html>
