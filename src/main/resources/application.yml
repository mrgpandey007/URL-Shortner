# ============================================================
# URL Shortener — Application Configuration
# ============================================================

spring:
  application:
    name: url-shortener

  # --- Database (PostgreSQL) ---
  datasource:
    url: jdbc:postgresql://localhost:5432/urlshortener
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    # HikariCP connection pool settings
    hikari:
      maximum-pool-size: 20         # Max DB connections in pool
      minimum-idle: 5               # Always keep 5 warm connections
      connection-timeout: 30000     # 30s timeout to get a connection
      idle-timeout: 600000          # Drop idle connections after 10min

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      # validate: check schema matches entities (production)
      # update: auto-create/update tables (development)
      # create-drop: rebuild on restart (testing only)
      ddl-auto: update
    show-sql: false   # Set to true for debugging SQL queries
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # --- Redis ---
  data:
    redis:
      host: localhost
      port: 6379
      # password: your-redis-password   # Uncomment for secured Redis
      timeout: 2000ms     # Connection timeout — fail fast, don't hang
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # --- Cache ---
  cache:
    type: redis

# --- App-specific Settings ---
app:
  base-url: https://short.ly    # Change this to your actual domain

# --- Server ---
server:
  port: 8080

# --- Actuator (Health & Metrics) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# --- Logging ---
logging:
  level:
    com.urlshortener: INFO
    org.springframework.cache: DEBUG   # Shows cache hits/misses — useful for tuning
    org.hibernate.SQL: WARN
